<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding 3</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 16px; background:#2b2e33; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display:flex; justify-content:center; }
  .frame { width:390px; background:#14171c; border-radius:28px; overflow:hidden; color:#eef0f3; border:6px solid #05070a; }
</style>
</head>
<body>
<div class="frame">
<div style="padding:2rem 1.4rem 1.5rem;min-height:520px;display:flex;flex-direction:column;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
    <div style="width:64px;height:64px;border-radius:50%;background:#332618;display:flex;align-items:center;justify-content:center;margin-bottom:20px;"><i class="ti ti-shield-check" style="font-size:28px;color:#e8a33d;"></i></div>
    <p style="font-size:20px;font-weight:500;color:#f5f6f8;margin:0 0 10px;">Durma tranquilo com sua reserva</p>
    <p style="font-size:13px;color:#8a8f98;margin:0;line-height:1.6;">O app calcula sua reserva de emergência ideal e avisa antes do mês fechar no vermelho — não depois.</p>
  </div>
  <div style="display:flex;justify-content:center;gap:6px;margin-bottom:16px;"><span style="width:6px;height:4px;border-radius:4px;background:#262b33;"></span><span style="width:6px;height:4px;border-radius:4px;background:#262b33;"></span><span style="width:18px;height:4px;border-radius:4px;background:#e8a33d;"></span></div>
  <button style="width:100%;background:#e8a33d;color:#2a1c04;border:none;border-radius:10px;padding:12px 0;font-size:14px;font-weight:500;">Criar minha conta</button>
</div>
</div>
</body>
</html>
