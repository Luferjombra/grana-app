repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(apps/backend|etl)/
      - id: ruff-format
        files: ^(apps/backend|etl)/

  - repo: local
    hooks:
      - id: mobile-lint
        name: expo lint (apps/mobile)
        entry: bash -c 'cd apps/mobile && npm run lint'
        language: system
        files: ^apps/mobile/
        pass_filenames: false

      - id: mobile-typecheck
        name: tsc --noEmit (apps/mobile)
        entry: bash -c 'cd apps/mobile && npx tsc --noEmit'
        language: system
        files: ^apps/mobile/.*\.tsx?$
        pass_filenames: false
