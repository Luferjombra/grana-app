[project]
name = "grana-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "supabase>=2.9",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "mindee>=5.1",
    "python-multipart>=0.0.12",
    # zoneinfo precisa da base de fusos: Windows não tem, e imagens Docker
    # slim também não. O cron da spec 07 roda "meia-noite local" (BRT).
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "black>=24.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends()/File()/Query() como default é o padrão idiomático do FastAPI.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
